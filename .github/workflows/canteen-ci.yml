name: College Canteen CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-canteen:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest -v test_canteen.py
